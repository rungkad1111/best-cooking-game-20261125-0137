<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Sizzle &amp; Serve — a busy-bistro cooking game</title>
<style>
  html, body {
    margin: 0;
    padding: 0;
    background: #1d130d;
    height: 100%;
  }
  body {
    display: flex;
    align-items: center;
    justify-content: center;
    font-family: system-ui, sans-serif;
  }
  #game {
    width: min(1280px, 100vw);
    height: auto;
    aspect-ratio: 1280 / 800;
    display: block;
    background: #c98d5f;
    image-rendering: auto;
  }
</style>
</head>
<body>
<canvas id="game" width="1280" height="800"></canvas>
<script type="module">
  import { bootGame } from './src/main.js';
  bootGame(document.getElementById('game'));
</script>
</body>
</html>
